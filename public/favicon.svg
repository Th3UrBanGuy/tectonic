<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Top Plate: Crisp Pure White to Light Silver -->
    <linearGradient id="topPlate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E4E4E7" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Stem: Brushed Platinum Gradient -->
    <linearGradient id="stemPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#A1A1AA" />
    </linearGradient>
  </defs>

  <!-- Deep Pitch Black Background -->
  <rect width="512" height="512" rx="110" fill="#050505"/>

  <!-- 1. Inner Fold Triangle (Deep Gunmetal Shadow for 3D Depth) -->
  <polygon points="186,192 324,192 214,234" fill="#3F3F46"/>

  <!-- 2. Lower Slanted Stem (Starting cleanly from the fold line) -->
  <polygon points="205,237 324,192 292,436 178,436" fill="url(#stemPlate)"/>

  <!-- 3. Top Rounded Slanted Bar (Exact geometry from your image) -->
  <path d="M 134 108
           H 414
           Q 440 108 428 132
           L 404 176
           Q 394 192 372 192
           H 98
           Q 72 192 84 168
           L 108 124
           Q 118 108 134 108 Z"
        fill="url(#topPlate)"/>
</svg>
